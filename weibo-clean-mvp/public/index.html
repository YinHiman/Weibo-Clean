<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="极简微博热搜阅读器，过滤你不感兴趣的内容。">
  <title>微博热搜 · Clean</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">WEIBO / CLEAN</p>
        <h1>微博热搜<span class="period">.</span></h1>
      </div>
      <button id="settings-open" class="icon-button" aria-label="过滤设置" title="过滤设置">设置</button>
    </header>

    <section class="meta-row">
      <span id="updated-at">正在连接热搜…</span>
      <button id="refresh-button" class="text-button">刷新 ↻</button>
    </section>

    <nav class="tabs" aria-label="热搜分类">
      <button class="tab active" data-category="全部">全部</button>
      <button class="tab" data-category="社会">社会</button>
      <button class="tab" data-category="科技">科技</button>
      <button class="tab" data-category="财经">财经</button>
      <button class="tab" data-category="国际">国际</button>
      <button class="tab" data-category="民生">民生</button>
    </nav>

    <section id="notice" class="notice" hidden></section>
    <section id="list" class="hot-list" aria-live="polite">
      <div class="empty">正在获取热搜…</div>
    </section>

    <footer>
      <span>只读热搜 · 不加载微博信息流</span>
      <span id="result-count"></span>
    </footer>
  </main>

  <dialog id="settings-dialog">
    <form method="dialog" id="settings-form">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">PERSONAL FILTER</p>
          <h2>内容过滤</h2>
        </div>
        <button class="icon-button" value="cancel" aria-label="关闭">关闭</button>
      </div>
      <p class="setting-label">默认屏蔽</p>
      <div class="checks">
        <label><input type="checkbox" name="block" value="娱乐"> 明星 / 娱乐</label>
        <label><input type="checkbox" name="block" value="综艺"> 综艺节目</label>
        <label><input type="checkbox" name="block" value="体育"> 体育赛事</label>
        <label><input type="checkbox" name="block" value="粉丝"> 粉丝文化</label>
        <label><input type="checkbox" name="block" value="游戏"> 游戏娱乐</label>
      </div>
      <label class="setting-label" for="block-words">自定义屏蔽词（逗号分隔）</label>
      <textarea id="block-words" rows="3" placeholder="例如：恋情, 打榜, 选秀"></textarea>
      <label class="setting-label" for="keep-words">自定义保留词（逗号分隔）</label>
      <textarea id="keep-words" rows="3" placeholder="例如：半导体, 人工智能, 政策"></textarea>
      <div class="dialog-actions">
        <button type="button" id="reset-settings" class="secondary-button">恢复默认</button>
        <button type="submit" id="save-settings" class="primary-button" value="save">保存设置</button>
      </div>
      <p class="small-note">设置仅保存在此 Safari 浏览器中。过滤基于规则，个别标题可能需要手动调整。</p>
    </form>
  </dialog>

  <script src="/app.js"></script>
</body>
</html>
